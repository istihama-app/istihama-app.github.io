.btn:not(.pri),.chip.btn:not(.on),.icon-btn,.navbtn{background:var(--card)}
.chip.btn:not(.on){color:var(--ink)} .axeditbtn{border-radius:10px;padding:5px 10px;color:var(--pri,var(--ink));font-weight:600}
.btn.pri,.chip.on,.chip.btn.on{border-color:var(--pri,var(--ink)) !important}
span.chip:not(.btn){border-style:dashed}
.card.hero{background:linear-gradient(160deg, color-mix(in srgb,var(--tint,#f3e6c8) 38%,var(--card)) 0%, var(--card) 62%) !important}

/* узор фона (v43): плитка SVG в цвет темы, --pat ставит applyTheme() */
body{background:var(--pat,none) fixed, radial-gradient(1100px 480px at 50% -180px, color-mix(in srgb,var(--tint,#f3e6c8) 55%,transparent), transparent 70%) fixed, var(--bg)}
.brandar{font-family:IhsanAr,Tahoma,serif;font-weight:700;color:var(--pri,var(--ink));opacity:.75;font-size:1.05em;margin-left:4px}
.card.hero{position:relative;overflow:hidden} .card.hero > :not(.wmark){position:relative;z-index:1}
.wmark{position:absolute;right:16px;bottom:10px;font:700 54px/1 IhsanAr,Tahoma,serif;color:var(--pri,var(--ink));opacity:.12;pointer-events:none;user-select:none;white-space:nowrap;z-index:0}
.icpick{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px} .icpick button{padding:3px;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer} .icpick button.on{border-color:var(--pri,var(--ink))} .icpick img{width:100%;aspect-ratio:1;border-radius:12px;display:block}
.patsw{height:38px;border-radius:9px;width:100%;border:1px solid var(--line);background-size:auto 100% !important}
/* Темы «Тёплый Ихсан», «Личный дневник» и «Город в сумерках». */
:root[data-theme=warm]{--bg:#f4ead8;--card:#fffaf0;--line:#ddcba6;--soft:#f0e6d1;--muted:#625b48;--ink:#193528;--tint:#e9d9ad;--pri:#28553d;--onpri:#fffaf0}
:root[data-theme=warm][data-dark=on]{--bg:#102019;--card:#192e24;--line:#455243;--soft:#23382d;--muted:#bfbea8;--ink:#f8eed8;--tint:#354838;--pri:#e1bd7a;--onpri:#15271d}
:root[data-theme=journal]{--bg:#f5ecde;--card:#fff8ec;--line:#ded0bc;--soft:#f0e3d3;--muted:#665b55;--ink:#25324a;--tint:#f0d3bf;--pri:#9d482f;--onpri:#fff8ec}
:root[data-theme=journal][data-dark=on]{--bg:#201c20;--card:#30282b;--line:#534148;--soft:#3c3033;--muted:#cbb7ad;--ink:#fbede4;--tint:#52372f;--pri:#efa283;--onpri:#251b20}
:root[data-theme=twilight]{--bg:#111629;--card:#1b2239;--line:#394361;--soft:#252e48;--muted:#b7bfd4;--ink:#faf0df;--tint:#383357;--pri:#f2ad78;--onpri:#20192a;--cur1:#ffd48f;--cur2:#ce865e}
:root[data-theme=warm] .card.hero{background:var(--pat,none),linear-gradient(145deg,var(--tint),var(--card) 68%) !important;border-color:var(--gold)}
:root[data-theme=journal] .card.hero{background:repeating-linear-gradient(transparent 0 27px,color-mix(in srgb,var(--line) 45%,transparent) 27px 28px),var(--card) !important;border-left:3px solid var(--pri)}
:root[data-theme=twilight] .card.hero{background:radial-gradient(ellipse at 85% 0%,#684256 0%,transparent 65%),linear-gradient(145deg,#303a62,var(--card) 72%) !important}
:root[data-theme=warm]{--hero-art:url('./themes/warm.webp');--hero-art-color:#082919}
:root[data-theme=journal]{--hero-art:url('./themes/journal.webp');--hero-art-color:#f7ead3}
:root[data-theme=twilight]{--hero-art:url('./themes/twilight.webp');--hero-art-color:#151f52}
:root:is([data-theme=warm],[data-theme=journal],[data-theme=twilight]) .card.hero{padding-top:112px}
:root:is([data-theme=warm],[data-theme=journal],[data-theme=twilight]) .card.hero::before{
  content:"";position:absolute;inset:0 0 auto;height:108px;pointer-events:none;
  background:linear-gradient(to bottom,transparent 72%,var(--card)),
    linear-gradient(to right,var(--hero-art-color) max(0px,calc(100% - 342px)),transparent calc(100% - 255px)),
    var(--hero-art) right center / auto 100% no-repeat,var(--hero-art-color);
}
:root:is([data-theme=warm],[data-theme=journal],[data-theme=twilight]) .top h1,
:root:is([data-theme=warm],[data-theme=journal],[data-theme=twilight]) .hero .hl{font-family:Georgia,serif}
.thbtn[aria-pressed=true]{border-color:var(--pri) !important;box-shadow:inset 0 0 0 1px var(--pri);font-weight:700}
.diary-page{border-left:3px solid var(--pri);background:repeating-linear-gradient(var(--card) 0 27px,var(--soft) 27px 28px)}
.diary-pages{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center;margin-bottom:10px;touch-action:pan-y}
.diary-pages button{min-height:44px}
.diary-pages button:disabled{opacity:.45}
.cycle-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px;text-align:center;margin-top:8px}
.cycle-grid a{min-height:34px;display:grid;place-items:center;border:1px solid var(--line);border-radius:7px;color:var(--ink);text-decoration:none}
.cycle-grid a.on{background:var(--pri);color:var(--onpri)}
.people-map{display:grid;justify-items:center;gap:0}
.people-map .people-self{border:1px solid var(--pri);border-radius:999px;background:var(--tint);padding:9px 18px;font-weight:700}
.people-branches{width:100%;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;position:relative;padding-top:22px}
.people-branches::before{content:"";position:absolute;inset:0 16.7% auto;height:12px;border-bottom:1px solid var(--line);background:linear-gradient(var(--line),var(--line)) center top / 1px 100% no-repeat}
.people-branches a{position:relative;display:grid;justify-items:center;text-align:center;gap:2px;min-width:0;padding-inline:4px;text-decoration:none}
.people-branches a::before{content:"";position:absolute;left:50%;bottom:100%;height:10px;border-left:1px solid var(--line)}
.people-list article{padding:10px 0;border-top:1px solid var(--line);overflow-wrap:anywhere}
.person-form{display:grid;gap:8px;margin:8px 0}
.person-form .in{min-width:0}
.study-form,.saving-form{display:grid;gap:10px;margin-top:10px}
.study-form .f,.saving-form .f{margin:0;min-width:0}
.study-card h2,.study-card .study-provider{overflow-wrap:anywhere}
.saving-title{overflow-wrap:anywhere;margin:4px 0 8px}
.saving-amount{font-size:clamp(21px,5vw,30px);font-weight:750;line-height:1.25}
.saving-line{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:1px solid var(--line)}
.people-list h2{scroll-margin-top:12px}
.family-level{position:relative;display:grid;justify-items:center;gap:6px;padding:12px 8px}
.family-level + .family-level{border-top:1px solid var(--line)}
.family-level .chip{max-width:100%;white-space:normal;overflow-wrap:anywhere;min-height:40px}
.family-level .chips{justify-content:center}
.family-focus{display:grid;justify-items:center;padding:12px;border-block:1px solid var(--line);background:var(--soft);overflow-wrap:anywhere}
.family-link{border-top:1px solid var(--line);padding:8px 0;overflow-wrap:anywhere}
.life-wheel{display:grid;justify-items:center;gap:12px;text-align:center}
.life-dial{position:relative;width:min(100%,252px);aspect-ratio:1;border-radius:50%;touch-action:none;cursor:grab}
.life-dial:focus-visible{outline:2px solid var(--pri);outline-offset:3px}
.life-dial::after{content:"";position:absolute;top:-5px;left:calc(50% - 7px);width:0;height:0;border:7px solid transparent;border-top:13px solid var(--pri);pointer-events:none}
.life-face{position:absolute;inset:0;border-radius:50%;border:2px solid var(--line);transform:rotate(var(--turn));transition:transform .22s ease;
  background:conic-gradient(from -30deg,var(--faith-s) 0 60deg,var(--mind-s) 60deg 120deg,var(--spirit-s) 120deg 180deg,var(--body-s) 180deg 240deg,var(--tint) 240deg 300deg,var(--soft) 300deg)}
.life-face::before{content:"";position:absolute;inset:0;border-radius:50%;background:repeating-conic-gradient(from -30deg,var(--line) 0 1deg,transparent 1deg 60deg)}
.life-mark{position:absolute;inset:0;display:grid;justify-items:center;align-items:start;padding-top:18px;transform:rotate(var(--sector));pointer-events:none}
.life-mark .ic{width:25px;height:25px;transform:rotate(calc(0deg - var(--sector) - var(--turn)));transition:transform .22s ease}
.life-center{position:absolute;inset:33%;display:grid;place-items:center;background:var(--card);border:1px solid var(--line);border-radius:50%;color:var(--pri);pointer-events:none}
.life-center .ic{width:30px;height:30px}
.life-controls{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:center;gap:10px;width:min(100%,360px)}
@media(prefers-reduced-motion:reduce){.life-face,.life-mark .ic{transition:none}}
.transfer-page #side,.transfer-page #bnav{display:none}
.transfer-page .app{display:block}
.transfer-page main{max-width:600px;margin:0 auto;padding:28px 16px}
.movecard .brandar{margin-left:8px}
.movecard ol{padding-left:22px}
.movecard li+li{margin-top:6px}
</style>

// Погода в городе. settings.weather: 'auto' — сама по дате и времени года (меняется каждые 4 часа), 'off' — всегда ясно, или вручную.
// Всё от сида (дата + отрезок дня), без Math.random. Капли и снежинки — функция времени, рисуются поверх карты (Wx.draw).
const Wx = (() => {
  const N = {clear:'ясно', clouds:'облачно', rain:'дождь', snow:'снег', fog:'туман'};
  const P = {summer:[['clear',.55],['clouds',.25],['rain',.15],['fog',.05]], spring:[['clear',.35],['clouds',.3],['rain',.25],['fog',.1]],
             autumn:[['clear',.3],['clouds',.3],['rain',.27],['fog',.13]], winter:[['clear',.3],['clouds',.28],['snow',.32],['fog',.1]]};
  const fr = x => x - Math.floor(x), hh = i => fr(Math.sin(i*12.9898 + 78.233)*43758.5453);
  let test = null;   // для тестов: {k} подменяет погоду, {t} — время анимации
  function at(d){ d = d || new Date(); const R = rng(hstr('wx' + key(d))), list = P[curSeason()] || P.summer;
    let x = R(), k = 'clear'; for (const [n,p] of list){ if (x < p){ k = n; break; } x -= p; }
    const blk = Math.floor(d.getHours()/4); for (let i=0;i<blk;i++) R(); const v = R();
    if ((k === 'rain' || k === 'snow') && v < .35) return {k:'clouds', day:k};   // осадки идут не весь день
    if (k === 'fog' && blk >= 3) return {k:'clouds', day:k};                       // туман — по утрам
    return {k, day:k, i:.55 + v*.45}; }
  function now(){ if (test && test.k) return {k:test.k, i:test.i || 1};
    const m = S.settings.weather || 'auto'; if (m === 'off') return {k:'clear'}; if (N[m]) return {k: m === 'rain' && curSeason() === 'winter' ? 'snow' : m, i:1};
    const w = at(); if (w.k === 'rain' && curSeason() === 'winter') w.k = 'snow'; return w; }
  const moving = () => { const k = now().k; return k === 'rain' || k === 'snow'; };
  function draw(ctx, W, H, d, ph, still){ const w = now(), night = ph === 'night' || ph === 'evening', t = test && test.t != null ? test.t : (still ? 0 : performance.now()/1000);
    if (w.k === 'clear') return;
    const tint = {clouds:night?'rgba(20,24,36,.16)':'rgba(120,128,140,.16)', rain:night?'rgba(16,20,34,.30)':'rgba(70,84,104,.26)', snow:night?'rgba(30,36,56,.18)':'rgba(230,236,244,.18)', fog:night?'rgba(70,76,90,.30)':'rgba(236,236,232,.38)'}[w.k];
    ctx.fillStyle = tint; ctx.fillRect(0, 0, W, H);
    if (w.k === 'fog'){ const g = ctx.createLinearGradient(0, 0, 0, H); g.addColorStop(0, night?'rgba(90,96,112,.0)':'rgba(245,245,240,0)'); g.addColorStop(1, night?'rgba(90,96,112,.35)':'rgba(245,245,240,.5)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); return; }
    if (w.k === 'clouds') return;
    const n = Math.round(W*H/(d*d)/(w.k === 'rain' ? 2600 : 3400)*(w.i || 1));
    if (w.k === 'rain'){ ctx.strokeStyle = night ? 'rgba(170,190,220,.55)' : 'rgba(225,235,248,.75)'; ctx.lineWidth = 1.1*d; ctx.lineCap = 'round'; ctx.beginPath();
      const L = 15*d, vx = -110*d, vy = 620*d;
      for (let i=0;i<n;i++){ const x = fr(hh(i) + t*vx/W*(.9 + hh(i+7)*.2))*W, y = fr(hh(i+3) + t*vy/H*(.85 + hh(i+11)*.3))*H; ctx.moveTo(x, y); ctx.lineTo(x + L*vx/vy, y + L); }

    ctx.fillStyle = night ? 'rgba(220,228,245,.85)' : 'rgba(255,255,255,.95)';
    for (let i=0;i<n;i++){ const sp = .6 + hh(i+5)*.8, y = fr(hh(i+3) + t*45*d*sp/H)*H, x = fr(hh(i) + Math.sin(t*.8 + i)*.004 + t*-8*d/W)*W, r = (1.2 + hh(i+9)*1.6)*d;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill(); } }
  return {N, at, now, moving, draw, get test(){ return test; }, set test(v){ test = v; }};
})();

    {id:'safe',   n:'Безопасность',  base:150, s:{fire:220}},

function popCap(){ const L = cityLvl(), G = gGrid(), B = S.build; let c = POP.base[L-1] + nbStages().filter(x => x >= 3).length*POP.nb + (B.house && B.house.roof ? POP.own : 0) + (annexSt().roof ? POP.annex : 0);

const popNeedOn = n => { const L = cityLvl(); return n.base || (n.L ? L >= n.L : Object.keys(n.s).some(id => ECON.town[id] && ECON.town[id].L <= L)); };

function newsItems(){ const T = S.town, tk = key(today()), yk = key(addD(today(), -1)), H = (T.pop && T.pop.h) || [], v = popNow(), N = popNeeds(v), out = [], R = rng(hstr('news' + tk));

    ax:Object.fromEntries(AXO.map(a=>[a, days.reduce((x,d)=>x+(d?axisScore(d,a):0),0)/n])),

function familyLevels(edges, start, direction){
  const seen = new Set([start]), levels = [];
  let generation = [start];
  while (generation.length){
    const current = new Set(generation);
    generation = [];
    for (const link of edges){
      const next = link[1-direction];
      if (!current.has(link[direction]) || seen.has(next)) continue;
      seen.add(next); generation.push(next);
    }
    if (generation.length) levels.push(generation);
  }
  return levels;
}

let AC = null;

function vib(p){ try { if (navigator.userActivation && !navigator.userActivation.hasBeenActive) return; if (navigator.vibrate) navigator.vibrate(p); } catch(e){} }
function beep(){ if (!S.timers.sound) return; try { audioUnlock(); if (!AC) return; const t0 = AC.currentTime + .02;
  [0,.4,.8].forEach((dt,i)=>{ const o = AC.createOscillator(), g = AC.createGain(); o.type = 'sine'; o.frequency.value = i===2 ? 880 : 660;
    g.gain.setValueAtTime(0, t0+dt); g.gain.linearRampToValueAtTime(.07, t0+dt+.03); g.gain.exponentialRampToValueAtTime(.0001, t0+dt+.35);
    o.connect(g); g.connect(AC.destination); o.start(t0+dt); o.stop(t0+dt+.4); }); } catch(e){} }

  if (!r){ if (!p) return; R[id] = {dur:p.m*60000, acc:0, st:now, day:key(today())}; toast(`Пошёл отсчёт: ${p.t}, ${p.m} мин`); }
  else if (r.st){ r.acc += now - r.st; r.st = null; toast('Пауза'); }
  else r.st = now;
  save(true); }

  const r = S.timers.run[id], p = tPreset(id) || {t:'Задача'}; delete S.timers.run[id];

  if (!done.length) return false;

function coins(){
  const tk = key(today()), NF = ['mind','spirit','body'], its = {length: NF.reduce((a,x)=>a+ITEM0[x],0)}, bn = townBonus(), kx = ax => 1 + (bn[ax] + bn.all)/100;   // здания города прибавляют проценты
  const sumD = d => d ? NF.reduce((a,x)=>a+axisScore(d,x)*ITEM0[x],0) : 0, coinD = d => d ? NF.reduce((a,x)=>a+axisScore(d,x)*ITEM0[x]*kx(x),0)*ECON.item : 0;   // свои пункты не раздувают монеты
  const r = {items:0, timers:0, nTimers:0, nWeeks:0, nFears:0, today:0, bonus:0, own:0, nOwn:0, tax:0, taxToday:0}, tf = S.town && S.town.taxFrom, dv = tf ? devN() + distCap() + popTax() : 0;
  for (const k in S.days){ if (k > tk) continue; const c = coinD(getDay(k)); r.items += c; r.bonus += c - sumD(S.days[k])*ECON.item; if (k===tk) r.today += c;
    if (tf && k >= tf && dv){ const tx = Math.min(dv, Math.round(c*ECON.taxK)); r.tax += tx; if (k===tk){ r.today += tx; r.taxToday = tx; } }
    const no = Math.min(ECON.ownMax, (S.days[k].own||[]).filter(o=>o && o.d).length); r.nOwn += no; r.own += no*ECON.own; if (k===tk) r.today += no*ECON.own; }
  for (const k in S.timers.log){ if (k > tk) continue;
    const ids = new Set((S.timers.log[k]||[]).filter(l=>{ const it = tItem(tPreset(l.id)); return !it || it.ax!=='faith'; }).map(l=>l.id));
    const n = Math.min(ids.size, ECON.timerMax); r.nTimers += n; r.timers += n*ECON.timer; if (k===tk) r.today += n*ECON.timer; }
  for (let m = monday(firstStart()), i = 0; addD(m,6) < today() && i < 600; m = addD(m,7), i++){
    let ok = true; for (let j=0;j<7&&ok;j++) ok = sumD(getDay(key(addD(m,j))))/its.length >= .5; if (ok) r.nWeeks++; }

function stageInfo(what, s, X){
  const B = S.build, i = STG.indexOf(s), st = ECON.stage[s], cur = B[what];
  if (cur[s]) return {done:cur[s]};
  if (!B.clear) return {lock:'Сначала расчисти участок'};
  if (i>0 && !cur[STG[i-1]]) return {lock:`Сначала — ${ECON.stage[STG[i-1]].n.toLowerCase()}`};
  if (what==='mosque') return {pray:true, cost:ECON.pray[s], ok:true};
  const tools = st.tools.filter(t=>!B.tools[t]), miss = {}; let cost = 0;

// Дом на три комнаты. o: hw, hd, st{found,walls,roof}, look, open{spirit,mind,body}, scaff, sel, all (всё открыто — для примерки), lod (1 — мелко, для города), hit

// Маленькая мечеть с минаретом. o: hw, hd, st{found,walls,roof}, sel, lod. Фасад (ly = +hd) — стена киблы с михрабом.
function isoMosque(K, F, o){
  const {mix,poly,line,C,n1,dark,k} = K, {G,S2,rect,fr,rt,box,W3} = F, {hw,hd,st} = o, lod = o.lod||0, zt = 3.2, ac = 'var(--faith)';

  if (!st.found){ g += poly(rect(-hw,hw,-hd,hd), C.earth2, 'opacity=".7"') + line([...rect(-hw,hw,-hd,hd,.42), G(-hw,-hd,.42)], dark?'#e9dcc0':'#fff8e6', .8, 'stroke-dasharray="3 2"');
    [[-hw,-hd],[hw,-hd],[hw,hd],[-hw,hd]].forEach(([x,y])=>{ g += line([G(x,y,0),G(x,y,.62)], C.woodD, 1.8, 'stroke-linecap="round"'); });
    g += line([G(hw,hd,0),G(hw,hd,2.3)], C.woodD, 1.4) + `<polygon points="${G(hw,hd,2.3)} ${G(hw-1.5,hd,1.95)} ${G(hw,hd,1.55)}" fill="${ac}"/>` + (o.sel ? mark(2.6) : '');
    return {g, mn, mp}; }

    for (let y=-hd+.1; y<hd-.3; y+=.72) g += line([G(hw-.08,y,.4),G(hw-.08,y,.95)], '#8a4f38', 1.1);
    return {g: g + (o.sel ? mark(1.6) : ''), mn: K.minaret(mp[0],mp[1],{...mq, part:0}), mp}; }
  const lit = !!st.roof, win = p => (lit ? poly(p, C.win, `stroke="${C.win}" stroke-opacity=".3" stroke-width="${n1(3.5*k)}" stroke-linejoin="round"`) : '') + poly(p, lit ? C.win : hole, `stroke="${frame}" stroke-width="${n1(.8*k)}" stroke-linejoin="round"`);
  const arch = (pp,c,w2,z0,zs,za) => [pp(c-w2,z0),pp(c-w2,zs),pp(c-w2*.62,zs+(za-zs)*.62),pp(c,za),pp(c+w2*.62,zs+(za-zs)*.62),pp(c+w2,zs),pp(c+w2,z0)];

  g += win(arch(pb,0,.48,.8,1.8,2.4)) + win(arch(pf,-1.45,.24,1.2,2,2.4)) + win(arch(pf,1.45,.24,1.2,2,2.4));

  if (cleared){ // утоптанная земля у построек и плитка от калитки
    h += poly([P(.9,2.5),P(19.3,2.5),P(19.3,13.8),P(12,16.8),P(.9,16.8)], C.earth, `stroke="${C.earth}" stroke-width="7" stroke-linejoin="round"`);
    for (let i=0;i<9;i++){ const x = 2+R()*16, y = 3.5+R()*11, p = XY(x,y); h += ell(p[0], p[1], 9+R()*12, 3+R()*3, C.earth2, 'opacity=".55"'); }
    for (let y=29.45, j=0; y>16.2; y-=1.05, j++){ const a = j%2 ? .08 : -.08;
      h += poly([P(9.2+a,y-.9,-.07),P(10.8+a,y-.9,-.07),P(10.8+a,y,-.07),P(9.2+a,y,-.07)], mix(C.tile,'#000',62)) + poly([P(9.2+a,y-.9),P(10.8+a,y-.9),P(10.8+a,y),P(9.2+a,y)], j%3 ? C.tile : mix(C.tile,'#fff',88)); }

    [[7.3,9.4],[12.1,11.2],[16.6,11.6]].forEach(([tx,ty],j)=>{ const n = Math.round(Math.hypot(tx-10,ty-15.6)/1.25); for (let i=1;i<=n;i++) h += stone(10+(tx-10)*i/n, 15.6+(ty-15.6)*i/n, i+j); });
  } else { for (let j=0;j<3;j++){ const y = 29.3-j*1.15; h += poly([P(9.3,y-.85),P(10.7,y-.85),P(10.7,y),P(9.3,y)], mix(C.tile,gB,55)); } }
  h += fence(0,0,PW,0, mix(C.wood,'#000',88), C.woodD) + fence(0,0,0,30, mix(C.wood,'#000',74), mix(C.woodD,'#000',80));

  // --- мелочь: трава, камни, пни ---
  const tuft = (x,y,ht,j) => { const p = XY(x,y), c = W ? mix(C.weak,'#6b5a3a',60) : j%3===0 ? mix(gA,'#e9d98a',70) : j%3===1 ? mix(gB,'#16260f',70) : gA, s = ht*9.4; let d = '';
    [[-2.6,-.75,-2.2],[-1.1,-1,-.3],[.3,-.95,1],[1.7,-.8,2.6],[2.9,-.55,4.2]].forEach(([bx,hh,tx])=>{ d += `M${n1(p[0]+bx)} ${n1(p[1])}Q${n1(p[0]+bx)} ${n1(p[1]+hh*s*.6)} ${n1(p[0]+tx)} ${n1(p[1]+hh*s)}`; });
    return `<path d="${d}" stroke="${c}" stroke-width="${ht>.6?1.5:1.1}" stroke-linecap="round" fill="none"/>`; };
  const rock = (x,y,w) => { const p = XY(x,y), hh = w*.78, q = a => a.map(([u,v])=>n1(p[0]+u*w)+','+n1(p[1]+v*hh)).join(' '), c = C.stone;
    return ell(p[0]+w*.3, p[1]+hh*.2, w*1.15, hh*.36, '#000', `opacity="${C.sh}"`) +
      `<polygon points="${q([[-1,0],[-.7,-.7],[-.1,-1],[.6,-.8],[1,-.1],[.6,.25],[-.5,.3]])}" fill="${mix(c,'#1b1714',58)}"/>` +
      `<polygon points="${q([[-1,0],[-.7,-.7],[-.45,-.4],[-.5,.3]])}" fill="${mix(c,'#1b1714',82)}"/>` +
      `<polygon points="${q([[-.45,-.4],[.15,-.45],[.6,.25],[-.5,.3]])}" fill="${mix(c,'#1b1714',70)}"/>` +
      `<polygon points="${q([[-.7,-.7],[-.1,-1],[.6,-.8],[.15,-.45],[-.45,-.4]])}" fill="${W ? C.snow : mix(c,'#fff2d8',82)}"/>`; };
  const stump = (x,y,r) => { const p = XY(x,y), hh = r*1.1, cx = n1(p[0]), cy = n1(p[1]);
    return ell(p[0]+r*.5, p[1]+1, r*1.5, r*.55, '#000', `opacity="${C.sh}"`) +
      `<path d="M${n1(p[0]-r*1.25)} ${n1(p[1]+r*.2)}Q${n1(p[0]-r)} ${cy} ${n1(p[0]-r)} ${n1(p[1]-hh)}L${n1(p[0]+r)} ${n1(p[1]-hh)}Q${n1(p[0]+r)} ${cy} ${n1(p[0]+r*1.3)} ${n1(p[1]+r*.25)}Q${cx} ${n1(p[1]+r*.75)} ${n1(p[0]-r*1.25)} ${n1(p[1]+r*.2)}Z" fill="${C.bark}"/>` +
      `<path d="M${cx} ${n1(p[1]-hh)}L${n1(p[0]+r)} ${n1(p[1]-hh)}Q${n1(p[0]+r)} ${cy} ${n1(p[0]+r*1.3)} ${n1(p[1]+r*.25)}Q${n1(p[0]+r*.5)} ${n1(p[1]+r*.6)} ${cx} ${n1(p[1]+r*.62)}Z" fill="${mix(C.bark,'#000',72)}"/>` +
      ell(p[0], p[1]-hh, r, r*.5, W ? C.snow : mix(C.wood,'#fff1cf',78)) + (W ? '' : `<ellipse cx="${cx}" cy="${n1(p[1]-hh)}" rx="${n1(r*.55)}" ry="${n1(r*.27)}" fill="none" stroke="${C.woodD}" stroke-width=".7"/>`); };
  const thistle = (x,y) => { const p = XY(x,y), c = W ? mix(C.weak,'#6b5a3a',55) : mix(gB,'#16260f',70), f1c = W ? C.snow : dark?'#9a78a8':'#a57fb5', f2c = W ? C.snow : dark?'#86689a':'#93699f';
    return `<path d="M${n1(p[0])} ${n1(p[1])}q-1 -8 1 -15M${n1(p[0])} ${n1(p[1]-6)}q4 -3 5 -8M${n1(p[0]+.4)} ${n1(p[1]-9)}q-4 -2 -5 -6" stroke="${c}" stroke-width="1.2" fill="none" stroke-linecap="round"/>` +
      circ(p[0]+1,p[1]-16,2.1,f1c) + circ(p[0]+5,p[1]-14.5,1.7,f2c) + circ(p[0]-4.6,p[1]-15.3,1.6,f1c); };
  const TREE = PLOT.tree, nearTree = (x,y,d) => Math.hypot(x-TREE[0], y-TREE[1]) < d;
  [[1.5,1.3],[4.6,1.2],[8,1.3],[11.4,1.2],[14.4,1.3],[17.6,1.3],[1.2,4.2],[1.2,18.6],[1.3,27],[18.8,17],[18.9,20.6],[18.8,24.3],[18.8,27.8],[2.2,28.8],[5.6,28.9],[14,28.9],[17,28.8]]
    .forEach(([x,y],i)=>{ const r = .62 + R()*.4, dx = (R()-.5)*.5, dy = (R()-.5)*.5; if (Y.fruit && x > 18 && y > 15) return; put(x+y, bush(x+dx, y+dy, cleared ? r : r*1.2, i)); });
  if (!cleared){
    for (let i=0;i<86;i++){ const x = .7+R()*18.6, y = .7+R()*28.6, ht = .75+R()*.75; if (nearTree(x,y,1.6) || (x>8.6&&x<11.4&&y>26) || (W && i%2)) continue; put(x+y, tuft(x,y,W?ht*.7:ht,i)); }
    for (let i=0;i<9;i++){ const x = 2+R()*16, y = 2.5+R()*23, w = 5+R()*5.5; if (nearTree(x,y,3)) continue; put(x+y+.3, rock(x,y,w)); }
    for (let i=0;i<5;i++){ const x = 2.5+R()*15, y = 3+R()*21, r = 3.6+R()*1.6; if (nearTree(x,y,3)) continue; put(x+y+.3, stump(x,y,r)); }
    for (let i=0;i<9;i++){ const x = 1.5+R()*17, y = 2+R()*26; if (nearTree(x,y,2.2) || (x>8.4&&x<11.6&&y>26)) continue; put(x+y+.2, thistle(x,y)); }
  } else {
    if (!W) for (let i=0;i<30;i++){ const x = .8+R()*18.4, y = 17.6+R()*11.6, ht = .3+R()*.2; if (x>8.7&&x<11.3) continue; put(x+y, tuft(x,y,ht,i)); }

    for (let i=0;i<34;i++){ const p = XY(.8+R()*18.4, (cleared?16.5:1)+R()*(cleared?12.5:28)); h += ell(p[0], p[1], 1.5, .75, LEAF[i%3], 'opacity=".75"'); } }
  if (W) for (let i=0;i<12;i++){ const p = XY(1+R()*18, 1+R()*28); h += ell(p[0], p[1], 10+R()*14, 3+R()*3, '#fff', 'opacity=".25"'); }

  // --- дерево года: высота — Вера, крона — Тело, цвет листвы — как прошли дни, плоды — цели. Сезон меняет листву, но не рост ---
  { const T = treeData(), eF = ez(T.F), eB = ez(T.B), [bx,by] = XY(TREE[0],TREE[1]), live = T.leaves.filter(l=>l.sc>0);

    t += ell(bx+Rc*.5, by+1.5, Math.max(6,Rc*(W?.6:1.1)), Math.max(2.4,Rc*(W?.2:.36)), '#000', `opacity="${C.sh}"`);

    t += `<path d="M${n1(bx+wb*.05)} ${n1(by)}L${n1(bx+wb*.04)} ${n1(by-Ht)}L${n1(bx+wb*.2)} ${n1(by-Ht)}Q${n1(bx+wb*.26)} ${n1(by-Ht*.45)} ${n1(bx+wb/2+1)} ${n1(by)}Z" fill="${mix(C.bark,'#000',70)}"/>`;
    if (W) t += `<path d="M${n1(bx-wb*.22)} ${n1(by-Ht*.15)}Q${n1(bx-wb*.24)} ${n1(by-Ht*.5)} ${n1(bx-wb*.17)} ${n1(by-Ht)}" stroke="#fff" stroke-width="1" opacity=".7" fill="none"/>`;
    if (live.length < 4){ const lc = W ? C.bark : LEAF[1];
      cr += W ? `<path d="M${n1(bx)} ${n1(by-Ht)}q-7 -5 -12 -3M${n1(bx)} ${n1(by-Ht)}q7 -6 12 -4" stroke="${C.bark}" stroke-width="1.3" fill="none" stroke-linecap="round"/>` + ell(bx-11,by-Ht-4,3,1.4,C.snow) + ell(bx+11,by-Ht-5,3,1.4,C.snow)
        : `<path d="M${n1(bx)} ${n1(by-Ht)}q-9 -7 -14 -1q7 5 14 1q8 -8 14 -2q-6 6 -14 2" fill="${lc}"/><path d="M${n1(bx)} ${n1(by-Ht)}q8 -8 14 -2q-6 6 -14 2" fill="${mix(lc,'#000',82)}"/>` + (sn==='spring' ? circ(bx-8,by-Ht-3,1.6,'#f6bfd0') + circ(bx+9,by-Ht-4,1.6,'#fff') : ''); }
    else { const cyc = by - Ht - Rc*.42, nb = Math.max(4, Math.min(13, 3 + Math.round(live.length/22))), a0 = TR()*6.28, bl = [];
      for (let j=0;j<nb;j++){ const rad = Math.sqrt((j+.5)/nb), an = j*2.39996 + a0, ch = live.slice(Math.floor(j*live.length/nb), Math.floor((j+1)*live.length/nb));
        const sc = ch.reduce((a,l)=>a+l.sc,0)/Math.max(1,ch.length); bl.push([bx + Math.cos(an)*rad*Rc*.82, cyc + Math.sin(an)*rad*Rc*.6, Rc*(.52 - .14*rad), LEAF[sc>=.75 ? 0 : sc>=.5 ? 1 : 2], j]); }
      if (W){ let d = ''; bl.forEach(([x,y])=>{ d += `M${n1(bx)} ${n1(by-Ht*.7)}Q${n1(bx+(x-bx)*.25)} ${n1(by-Ht*.98)} ${n1(x)} ${n1(y)}`; });   // зима: голые ветви в инее, рост тот же
        cr += `<path d="${d}" stroke="${C.bark}" stroke-width="${n1(1+wb*.2)}" fill="none" stroke-linecap="round"/><path d="${d}" stroke="#fff" stroke-width=".8" opacity=".55" fill="none" stroke-dasharray="5 4" transform="translate(-.7 -.9)"/>`;
        bl.forEach(([x,y,r],j)=>{ cr += `<path d="M${n1(x)} ${n1(y)}l${n1(-r*.5)} ${n1(-r*.45)}M${n1(x)} ${n1(y)}l${n1(r*.5)} ${n1(-r*.35)}M${n1(x)} ${n1(y)}l${n1(r*.05)} ${n1(-r*.7)}" stroke="${C.bark}" stroke-width="1" fill="none" stroke-linecap="round"/>` + ell(x, y-r*.1, r*.42, r*.17, C.snow, 'opacity=".95"') + (j%2 ? ell(x-r*.45, y-r*.5, r*.22, r*.1, '#fff') : ''); });
      } else { for (let j=0;j<3;j++){ const a = -1.57 + (j-1)*.75; cr += `<path d="M${n1(bx)} ${n1(by-Ht*.72)}Q${n1(bx+Math.cos(a)*Rc*.2)} ${n1(by-Ht)} ${n1(bx+Math.cos(a)*Rc*.55)} ${n1(cyc+Rc*.1)}" stroke="${C.bark}" stroke-width="${n1(1+wb*.22)}" fill="none" stroke-linecap="round"/>`; }
        bl.sort((a,b)=>a[1]-b[1]).forEach(([x,y,r,c,j])=>{ cr += K.blob(x,y,r,c);
          if (sn==='spring') cr += circ(x-r*.4,y-r*.1,r*.15,K.BLOS[j%3]) + circ(x+r*.3,y+r*.3,r*.13,K.BLOS[(j+1)%3]) + circ(x+r*.15,y-r*.5,r*.12,K.BLOS[(j+2)%3]) + circ(x-r*.1,y+r*.45,r*.11,K.BLOS[j%3]); }); }
      const fr2 = T.fruits.slice(0,10); fr2.forEach((f,i)=>{ const an = i*2.39996 + a0 + 1, rad = Math.sqrt((i+.5)/fr2.length), x = bx + Math.cos(an)*rad*Rc*.78, y = cyc + Rc*.08 + Math.sin(an)*rad*Rc*.56, r = f.p>=1 ? 2.3 : 1.6;
        cr += circ(x+.5,y+.7,r,'#000','opacity=".25"') + circ(x,y,r,`var(--${f.ax==='gold'?'gold':f.ax})`) + circ(x-r*.3,y-r*.3,r*.32,'#fff','opacity=".6"'); }); }
    put(TREE[0]+TREE[1], `<g data-act="gotree" style="cursor:pointer"><rect x="${n1(bx-Math.max(14,Rc)-4)}" y="${n1(by-Ht-Rc*1.1-4)}" width="${n1(Math.max(14,Rc)*2+8)}" height="${n1(Ht+Rc*1.1+10)}" fill="transparent"/>${t}<g class="psway" style="transform-origin:${n1(bx)}px ${n1(by)}px">${cr}</g></g>`); }

  // --- соседний участок: кусты по краю, трава, гостевой дом ---
  if (B.land){ const R2 = rng(hstr('land' + (S.settings.start || '')));
    [[21.5,1.3],[24.6,1.2],[27.8,1.3],[29.2,4],[29.1,13.5],[29.2,17.8],[29.1,22.6],[29.2,27.2],[21.4,28.9],[25,28.8],[28.4,28.9]].forEach(([x,y],i)=>put(x+y, bush(x, y, .6 + R2()*.35, i+3)));
    if (!W) for (let i=0;i<26;i++){ const x = 20.8+R2()*8.4, y = 13+R2()*15.5; put(x+y, tuft(x,y,.35+R2()*.25,i)); }
    for (let y=29.4, j=0; y>11.4; y-=1.05, j++){ const a = j%2 ? .07 : -.07; h += poly([P(24.4+a,y-.9),P(25.9+a,y-.9),P(25.9+a,y),P(24.4+a,y)], j%3 ? C.tile : mix(C.tile,'#fff',88)); }
    const An = PLOT.annex, Hs = isoHouse(K, K.frame(An.cx,An.cy,0), {hw:An.hw, hd:An.hd, st:annexSt(), look:B.look, open: annexSt().roof ? {spirit:1, mind:1, body:1} : {}});
    put(An.cx+An.cy, `<g data-act="proom" data-r="annex" style="cursor:pointer">${Hs.g}</g>`); }

  // --- мечеть с минаретом и дом на три комнаты ---
  let smoke = '';
  if (cleared){
    const Mq = PLOT.mosque, M = isoMosque(K, K.frame(Mq.cx,Mq.cy,rot), {hw:Mq.hw, hd:Mq.hd, st:B.mosque, sel:plotSel==='mosque'});
    put(Mq.cx+Mq.cy, `<g data-act="proom" data-r="mosque" style="cursor:pointer">${M.g}</g>`); put(Mq.cx+Mq.cy+.1, M.mn ? `<g data-act="proom" data-r="mosque" style="cursor:pointer">${M.mn}</g>` : '');
    const Hq = PLOT.house, Hs = isoHouse(K, K.frame(Hq.cx,Hq.cy,0), {hw:Hq.hw, hd:Hq.hd, st:B.house, look:B.look, open:B.open, scaff:B.tools.scaff, sel:plotSel, hit:1});
    put(Hq.cx+Hq.cy, `<g style="cursor:pointer">${Hs.g}</g>`); smoke = Hs.smoke;
    if (B.open.body){ const y = 12.3; put(17+y, line([P(16.5,y+.25),P(17.9,y+.4)], '#000', 2, `opacity="${C.sh}"`) + line([P(16.1,y),P(16.1,y,2.35)], C.steel, 1.7, 'stroke-linecap="round"') + line([P(17.6,y),P(17.6,y,2.35)], C.steel, 1.7, 'stroke-linecap="round"') + line([P(16,y,2.3),P(17.7,y,2.3)], dark?'#d5dadf':'#5f666d', 1.5, 'stroke-linecap="round"')); }
  }

  // --- двор: грядки, яблони, скамейка, цветник, беседка ---
  if (Y.beds) [19.6,21.3,23].forEach((y,j)=>{ const sc = W ? C.snow : mix(C.soilA,'#2a1a10',70); let o = pbox(13.4,18,y,y+1,0,.28, sc, mix(C.wood,'#000',86), C.woodD);
    if (!W) for (let x=13.9; x<17.8; x+=.62){ const p = XY(x,y+.5,.28); o += circ(p[0],p[1]-1.6,1.9,LEAF[(j+1)%3]) + circ(p[0]-.5,p[1]-2.2,1,mix(LEAF[(j+1)%3],'#fff3c4',80)) + (j===1 && sn!=='spring' ? circ(p[0]+.8,p[1]-1.2,.8,'#c8473a') : ''); }
    put(15.7+y+.5, o); });
  if (Y.fruit) [[18.2,18.6],[18.3,22.4],[18.2,26.4]].forEach(([x,y],i)=>put(x+y, K.treeS(x,y,2.3+i%2*.3,i,sn==='summer'||sn==='autumn')));
  if (Y.bench){ const x = 6.3, y = 21.6, c = C.wood; put(x+y+1, gsh(x+.6,y+.4,11,3.4) + pbox(x,x+.12,y,y+1.7,0,.5,null,C.woodD,C.woodD) + pbox(x+.5,x+.62,y,y+1.7,0,.5,null,C.woodD,C.woodD) + pbox(x-.05,x+.7,y-.1,y+1.8,.5,.6, W ? C.snow : mix(c,'#fff',86), c, mix(c,'#000',76)) + pbox(x-.05,x+.07,y-.1,y+1.8,.6,1.15, mix(c,'#fff',86), c, mix(c,'#000',70))); }
  if (Y.flowers) [[8.25,8.95],[11.05,11.75]].forEach(([x0,x1],j)=>{ let o = pbox(x0,x1,18.4,26.6,0,.16, W ? C.snow : mix(C.soilA,'#2a1a10',70), C.stone, mix(C.stone,'#000',76));

      o += circ(p[0],p[1]-1,1.7,LEAF[1]) + circ(p[0]-.4,p[1]-2.6,1.25,fc) + circ(p[0]+1.1,p[1]-1.7,1,fc); }
    put(x0+22.5, o); });

/* ---- новый квартал: сетка клеток к югу от нижней улицы (y = 57…58.4) ---- */
const GRID = {x0:-32, y0:59.5, c:8, nx:11, ny:5};
const DIST = { road:{n:'Дорога', p:15}, house:{n:'Жилой дом', p:80, cap:2}, house2:{n:'Дом в два этажа', p:120, cap:4}, house5:{n:'Многоэтажка', p:250, cap:6, L:5}, house9:{n:'Высотка', p:450, cap:9, L:6}, tower:{n:'Небоскрёб', p:800, cap:14, L:7, max:3}, office:{n:'Деловой центр', p:300, cap:7, L:5, max:4}, work:{n:'Мастерская', p:100, cap:2}, shop:{n:'Лавка', p:120, cap:3}, park:{n:'Сквер', p:50, cap:1}, trees:{n:'Деревья', p:15, cap:0} };
const DTOOLS = [['road','Дорога'],['house','Дом'],['office','Деловой центр'],['shop','Лавка'],['work','Мастерская'],['park','Сквер'],['trees','Деревья'],['move','Перенести'],['del','Снести']];
const UP = ['house','house2','house5','house9','tower'];   // ступени жилого дома: каждое нажатие «Домом» поднимает на ступень
const gOpen = t => !DIST[t].L || cityLvl() >= DIST[t].L, gLvlTxt = t => `${DIST[t].n} — с уровня города ${DIST[t].L}, «${CITY.names[DIST[t].L-1].toLowerCase()}»`;
const gMax = t => DIST[t].max && Object.values(gGrid()).filter(x=>x === t).length >= DIST[t].max;
let townBuild = false, townTool = 'road', townPick = '';
const gKey = (i,j) => i + ',' + j, gGrid = () => (S.town && S.town.grid) || {};
const gBlocked = (i,j) => i < 0 || j < 0 || i >= GRID.nx || j >= GRID.ny || (i >= 4 && i <= 7 && j <= 1);   // сад занимает свои клетки
const gCX = i => GRID.x0 + GRID.c*i + GRID.c/2, gCY = j => GRID.y0 + GRID.c*j + GRID.c/2;
const gCell = (x,y) => [Math.floor((x - GRID.x0)/GRID.c), Math.floor((y - GRID.y0)/GRID.c)];
const gN4 = (i,j) => [[i-1,j],[i+1,j],[i,j-1],[i,j+1]];
function gConn(G){ const seen = new Set(), q = []; for (const k in G) if (G[k] === 'road' && +k.split(',')[1] === 0){ seen.add(k); q.push(k); }   // дороги, связанные с улицей
  while (q.length){ const [i,j] = q.shift().split(',').map(Number); gN4(i,j).forEach(([a,b])=>{ const k = gKey(a,b); if (G[k] === 'road' && !seen.has(k)){ seen.add(k); q.push(k); } }); } return seen; }
const gNearRoad = (G, C, i, j) => gN4(i,j).some(([a,b]) => C.has(gKey(a,b)));
function gValid(G){ const C = gConn(G); for (const k in G){ const [i,j] = k.split(',').map(Number), t = G[k]; if (t === 'road' ? !C.has(k) : t !== 'trees' && !gNearRoad(G, C, i, j)) return false; } return true; }
const distCap = () => Object.values(gGrid()).reduce((a,t)=>a + ((DIST[t] && DIST[t].cap) || 0), 0);
const gHasRoad = () => Object.values(gGrid()).includes('road');
const gPaid = t => UP.includes(t) ? UP.slice(0, UP.indexOf(t)+1).reduce((a,u)=>a + DIST[u].p, 0) : (DIST[t] ? DIST[t].p : 0);
// что можно сделать текущим инструментом на клетке: {ok, cost, txt}

function cycle(v){ return v===1 ? .5 : v===.5 ? 0 : 1; }
document.addEventListener('click', async e => {
  lastAct = Date.now();
  const el = e.target.closest('[data-act]'); if (!el) return;
  const a = el.dataset.act, k = key(viewDate);
  switch(a){
    case 'wheelToggle':
      wayWheelOpen = !wayWheelOpen;
      if (wayWheelOpen) afterFns.push(()=>$('#lifeDial')?.focus({preventScroll:true}));
      break;
    case 'wheelStep': wheelShift(+el.dataset.v); return;
    case 'wheelSound':
      S.settings.wheelSound = !S.settings.wheelSound;
      el.setAttribute('aria-pressed',String(S.settings.wheelSound)); el.classList.toggle('on',S.settings.wheelSound);
      save(); return;
    case 'wheelGo': {
      const area = wheelArea()[2];
      wayWheelOpen = false;
      if (Object.hasOwn(AX,area)){ wayTab = area; break; }
      pathTab = area; location.hash = '#path'; return;
    }
    case 'familyFocus': familyFocus = el.dataset.id; break;
    case 'familyUnlink': {
      const {parent,child} = el.dataset;
      S.familyLinks = S.familyLinks.filter(link=>link?.[0] !== parent || link?.[1] !== child);
      save(true); break;
    }
    case 'peopleBranch':
      e.preventDefault();
      document.getElementById('people-' + el.dataset.t)?.scrollIntoView({block:'start'});
      return;
    case 'personContact': {
      const p = personById(el.dataset.id);
      if (!p) return;
      const now = today();
      p.last = key(now);
      const repeat = +p.repeat;
      p.remind = PEOPLE_REPEAT.some(([v])=>v > 0 && v === repeat) ? key(addD(now,repeat)) : '';
      save(true); toast('Общение отмечено'); break;
    }
    case 'personClear': {
      const p = personById(el.dataset.id);
      if (!p) return;
      p.remind = ''; p.repeat = 0; save(true); break;
    }
    case 'studyDelete': {
      const entry = S.studies[+el.dataset.index];
      if (!entry || !await ask('Удалить запись об обучении?','Удалить')) return;
      const index = S.studies.indexOf(entry);
      if (index < 0) return;
      S.studies.splice(index,1); save(true); break;
    }
    case 'personDelete': {
      const p = personById(el.dataset.id);
      if (!p || !await ask(`Удалить карточку «${esc(p.name)}»?`,'Удалить')) return;
      S.people = S.people.filter(person=>person !== p);
      S.familyLinks = S.familyLinks.filter(link=>link?.[0] !== p.id && link?.[1] !== p.id);
      save(true); break;
    }
    case 'report': openReport(); return;
    case 'ysel': yearSel = +el.dataset.n; break;
    case 'ynext': await yearNext(); return;
    case 'ystat': statT = 'year'; statO = 0; return;
    case 'yba': pathTab = 'ba'; return;
    case 'ycap': pathTab = 'capsule'; return;
    case 'onbitem': { const O = onbInit(), id = el.dataset.id; O.items.has(id) ? O.items.delete(id) : O.items.add(id); onbSync(); return; }
    case 'onbcity': { const O = onbInit(), c = CITIES.find(x => x[0] === el.dataset.n); if (c){ O.place = c[0]; O.lat = c[1]; O.lon = c[2]; O.decl = c[3]; } onbSync(); return; }
    case 'onbtheme': { const O = onbInit(); O.theme = el.dataset.t; S.settings.theme = O.theme; applyTheme(); onbSync(); return; }
    case 'onbgps': { const O = onbInit(); if (!navigator.geolocation) return toast('Телефон не даёт место — выбери город');
      toast('Определяю место…'); navigator.geolocation.getCurrentPosition(p => { O.lat = +p.coords.latitude.toFixed(4); O.lon = +p.coords.longitude.toFixed(4); const near = CITIES.find(c => Math.abs(c[1] - O.lat) < .3 && Math.abs(c[2] - O.lon) < .3); O.place = near ? near[0] : 'Моё место'; O.decl = near ? near[3] : 7; onbSync(); toast('Место определено'); }, () => toast('Не получилось — выбери город из списка'), {timeout:12000, maximumAge:600000}); return; }
    case 'onbdark': S.settings.dark = el.dataset.v; applyTheme(); onbSync(); return;
    case 'onbdone': onbDone(); return;
    case 'sex': S.settings.sex = el.dataset.v; save(); break;
    case 'evopen': viewDate = today(); evOpen = true; break;
    case 'evclose': evOpen = false; if (el.tagName === 'A') return; break;
    case 'evtown': evOpen = false; townShowToday = true; return;
    case 'tshow': TownMap.show(todayBuilt()); return;
    case 'evdone': { const d = ensureDay(key(today())), kept = dayKept(d); d.ev = 1; save(); evOpen = false; toast(kept ? 'Итог подведён. Доброй ночи' : 'Итог подведён. Завтра — новый день'); break; }
    case 'evsave': await evSave(); return;
    case 'dprev': viewDate = addD(viewDate,-1); break;
    case 'dnext': viewDate = addD(viewDate,1); break;
    case 'dtoday': viewDate = today(); break;
    case 'quickopen':
      quickIndex = 0; quickOpen = true;
      afterFns.push(()=>$('#quickCard')?.scrollIntoView({block:'nearest'})); break;
    case 'quickmark': {
      const id = el.dataset.id, d = ensureDay(k), val = +el.dataset.v;
      if (val) d.c[id] = val; else delete d.c[id];
      save();
    }
    // После ответа переходим к следующей карточке.
    case 'quicknext':
      if (++quickIndex < countedItems(k).length) break;
      quickOpen = false; S.settings.quickSeen = k; save(); break;
    case 'quickclose': quickOpen = false; S.settings.quickSeen = k; save(); break;
    case 'cyclemonth': cycleMonth = Math.min(0,cycleMonth + +el.dataset.v); break;
    case 'cycleday': {
      viewDate = parse(el.dataset.k);
      afterFns.push(()=>requestAnimationFrame(()=>{ const panel = $('#cycleDay'); if (panel){ panel.open = true; panel.scrollIntoView({block:'center'}); } }));
      return;
    }
    case 'cyclepr':
    case 'cycleall': {

    case 'pannex': { const B = S.build, A = B.annex || (B.annex = {}), st = el.dataset.s, i = STG.indexOf(st); if (!B.land || A[st] || i < 0 || (i > 0 && !A[STG[i-1]])) return;

    case 'tgo': tToggle(el.dataset.id); break;

    case 'tmin': { const p = tPreset(el.dataset.id); if (!p) return; const up = +el.dataset.d > 0;
      p.m = up ? (p.m < 10 ? p.m+1 : p.m+5) : (p.m <= 10 ? Math.max(1, p.m-1) : p.m-5); p.m = Math.min(p.m, 600); save(); break; }

    case 'tbn': { const D = curD(); let n = el.dataset.n === 'own' ? Math.round(+$('#tb_n').value) : +el.dataset.n; if (!(n >= 1)) return toast('Впиши число'); n = Math.min(n, 100000);
      D.n = n; if (D.c >= n) D.c = 0; save(); break; }
    case 'tbadd': { const t = $('#tb_t').value.trim(), n = Math.round(+$('#tb_k').value); if (!t) return toast('Впиши текст азкара'); if (!(n >= 1)) return toast('Сколько раз?');
      S.tasbih.list.push({t, ar:'', s:'', n:Math.min(n,100000), c:0, l:0, own:true}); S.tasbih.cur = S.tasbih.list.length-1; save(); toast('Добавлено'); break; }
    case 'tbdel': { const D = curD(); if (!D.own) return; if (await ask(`Удалить азкар «${esc(D.t)}»?`,'Удалить')) { S.tasbih.list.splice(S.tasbih.cur,1); S.tasbih.cur = 0; beadKey = -1; save(); } break; }
    case 'qcomp': startCompass(); return;
    case 'qgps': qGps(); return;
    case 'qhome': Object.assign(S.qibla, {lat:GROZNY.lat, lon:GROZNY.lon, place:GROZNY.place}); save(); break;
    case 'qset': { const la = +$('#q_lat').value, lo = +$('#q_lon').value; if ($('#q_lat').value==='' || $('#q_lon').value==='' || !(Math.abs(la) <= 90) || !(Math.abs(lo) <= 180)) return toast('Проверь широту и долготу');
      S.qibla.lat = la; S.qibla.lon = lo; S.qibla.place = (Math.abs(la-GROZNY.lat) < .05 && Math.abs(lo-GROZNY.lon) < .05) ? 'Грозный' : 'Своё место'; save(); toast('Место сохранено'); break; }
    case 'export': await doExport(); render(); return;
    case 'bklater': S.bkSnooze = Date.now(); save(); toast('Напомню через три дня'); break;
    case 'copyexp': { try { await navigator.clipboard.writeText(await exportText()); S.lastExport = Date.now(); save(); toast('Скопировано — вставь в «Избранное» в Telegram'); render(); } catch(err){ toast('Не получилось скопировать'); } return; }
    case 'import': $('#importFile').click(); return;
    case 'reset': if (await ask('Стереть ВСЕ данные на этом устройстве? Сначала сделай резервную копию.','Дальше') && await ask('Точно? Отменить будет нельзя.','Стереть')) { S = defaults(); KEY = null; diaryCache = null; PH.before = PH.after = null; await idbSet('photo_before',null); await idbSet('photo_after',null); save(true); toast('Данные стёрты'); } break;

  }
  render();

async function flushDiary(){ if (diaryCache?.dirty) await saveEntry(true); }

document.addEventListener('change', async e => {

      if (!await ask('Заменить все данные на этом устройстве данными из копии?','Заменить')) return;

    } catch(err){ toast('Это не файл копии приложения'); } t.value = ''; }; fr.readAsText(t.files[0]); }

document.addEventListener('submit', async e => {
  const f = e.target; if (!f.dataset.form) return; e.preventDefault(); const fd = new FormData(f);
  try {
    if (f.dataset.form === 'savingGoal'){
      const title = String(fd.get('title') || '').trim().slice(0,80);
      const target = savingAmount(fd.get('target'));
      const currency = S.savings.entries.length ? S.savings.currency : fd.get('currency');
      if (!title || !target || !Object.hasOwn(SAVING_CURRENCIES,currency)) return toast('Укажи название, валюту и сумму больше нуля');
      Object.assign(S.savings,{title,target,currency});
      save(true); render(); toast('Цель сохранена'); return;
    }
    if (f.dataset.form === 'savingEntry'){
      const amount = savingAmount(fd.get('amount')), withdraw = e.submitter?.value === 'withdraw';
      if (!amount || !(S.savings.target > 0)) return toast('Введи сумму больше нуля');
      const balance = savingTotal();
      if (withdraw && amount > balance) return toast('В накоплениях меньше этой суммы');
      if (!withdraw && balance + amount > SAVING_LIMIT) return toast('Сумма накоплений слишком велика');
      S.savings.entries.push({date:key(today()), amount:withdraw ? -amount : amount});
      save(true); render(); toast('Сумма записана'); return;
    }
    if (f.dataset.form === 'study'){
      const title = String(fd.get('title') || '').trim().slice(0,120);
      const provider = String(fd.get('provider') || '').trim().slice(0,100);
      const status = fd.get('status'), url = String(fd.get('certificate') || '').trim();
      const certificate = studyCertificate(url);
      if (!title || !Object.hasOwn(STUDY_STATUS,status)) return toast('Укажи название и статус');
      if (url && (!certificate || url.length > 2048)) return toast('Введи ссылку, которая начинается с https:// или http://');
      const entry = {title,provider,status,certificate};
      const index = f.dataset.index;
      if (index === '') S.studies.push(entry);
      else if (S.studies[+index]) Object.assign(S.studies[+index],entry);
      else return;
      save(true); render(); toast('Запись сохранена'); return;
    }
    if (f.dataset.form === 'familyLink'){
      const parent = fd.get('parent'), child = fd.get('child'), names = familyNames();
      if (!names.has(parent) || !names.has(child) || parent === child) return toast('Выбери двух разных людей');
      const edges = familyEdges(names);
      if (edges.some(([p,c])=>p===parent && c===child)) return toast('Такая связь уже есть');
      if (familyLevels(edges,child,0).some(level=>level.includes(parent))) return toast('Эта связь замкнёт древо');
      S.familyLinks.push([parent,child]); familyFocus = child; save(true); render(); return;
    }
    if (f.dataset.form === 'person'){
      const name = String(fd.get('name') || '').trim().slice(0,60), group = fd.get('group');
      if (!name || !Object.hasOwn(PEOPLE_GROUPS,group)) return toast('Укажи имя и ветку');
      const now = key(today()), last = personDate(fd.get('last')), repeat = +fd.get('repeat');
      if (last > now || !PEOPLE_REPEAT.some(([v])=>v === repeat)) return toast('Проверь дату и повтор');
      const remind = personDate(fd.get('remind')) || (repeat ? key(addD(parse(last || now),repeat)) : '');
      const data = {name,group,last,remind,repeat,relation:String(fd.get('relation') || '').trim().slice(0,60),prompt:String(fd.get('prompt') || '').trim().slice(0,100)};
      if (f.dataset.id){
        const p = personById(f.dataset.id);
        if (!p) return;
        Object.assign(p,data);
      } else {
        const stamp = Date.now().toString(36);
        let id = stamp, suffix = 0;
        while (personById(id)) id = stamp + '-' + (++suffix);
        S.people.push({id,...data});
      }
      save(true); render(); toast(f.dataset.id ? 'Карточка сохранена' : 'Человек добавлен'); return;
    }
    if (f.dataset.form === 'cycleRange'){
      const start = String(fd.get('start')), end = String(fd.get('end'));
      if (!S.settings.cycle || start > end || end > key(today()) || !/^\d{4}-\d\d-\d\d$/.test(start) || !/^\d{4}-\d\d-\d\d$/.test(end) || key(parse(start)) !== start || key(parse(end)) !== end) return toast('Проверь даты');
      const clearing = e.submitter?.value === 'clear';
      for (let d = parse(start); key(d) <= end; d = addD(d,1)){
        const k = key(d);
        if (clearing) delete S.cycleDays[k]; else if (!cycleMask(k)) S.cycleDays[k] = 31;
      }
      save(true); render(); return;
    }
    if (f.dataset.form === 'itadd'){ const t = String(fd.get('t')||'').trim().slice(0,60), a = f.dataset.a; if (!t || !AX[a]) return; if (itemsOn(key(today())).filter(i=>i.ax===a).length >= 10) return toast('В разделе уже 10 пунктов'); S.items.push({id:'u' + Date.now().toString(36), ax:a, t, from:key(today()), to:''}); save(); render(); toast('Пункт добавлен'); return; }
    if (f.dataset.form === 'ownadd'){ const t = String(fd.get('t')||'').trim().slice(0,80); if (!t) return; const d = ensureDay(key(viewDate)); d.own ||= []; if (d.own.length >= OWN_MAX_LIST) return toast('Дел на день уже много'); d.own.push({t, d:0}); save(); render(); setTimeout(()=>{ const i = $('#ownCard input'); if (i) i.focus(); }, 30); return; }
    if (f.dataset.form === 'dset'){ if (fd.get('p1') !== fd.get('p2')) return toast('Пароли не совпадают');
      const salt = b64(crypto.getRandomValues(new Uint8Array(16))), iter = 250000, k = await derive(fd.get('p1'), salt, iter);
      S.crypto = {salt, iter, check: await encObj(k, 'ok')}; KEY = k; save(true); toast('Дневник создан'); }
    if (f.dataset.form === 'dunlock'){ const k = await derive(fd.get('p'), S.crypto.salt, S.crypto.iter);
      try { if (await decObj(k, S.crypto.check) !== 'ok') throw 0; KEY = k; diaryCache = null; } catch(err){ return toast('Неверный пароль'); } }
    if (f.dataset.form === 'dchange'){ const ok = await derive(fd.get('o'), S.crypto.salt, S.crypto.iter);
      try { await decObj(ok, S.crypto.check); } catch(err){ return toast('Старый пароль неверный'); }
      const salt = b64(crypto.getRandomValues(new Uint8Array(16))), nk = await derive(fd.get('n'), salt, S.crypto.iter), nd = {};
      for (const [dk, box] of Object.entries(S.diary)) nd[dk] = await encObj(nk, await decObj(ok, box));
      S.diary = nd; S.crypto = {salt, iter:S.crypto.iter, check: await encObj(nk,'ok')}; KEY = null; diaryCache = null; save(true); toast('Пароль изменён'); }
  } catch(err){ toast('Ошибка шифрования в этом браузере'); }
  render();
});
async function exportText(){ return JSON.stringify({app:'chetyre-sily', v:1, exported:new Date().toISOString(), state:isOldHome() ? transferState() || S : S, photos:{before:PH.before, after:PH.after}}); }
const isPhone = () => matchMedia('(pointer: coarse)').matches;
async function shareFile(txt, name, type){ try { const f = new File([txt], name, {type}); if (isPhone() && navigator.canShare && navigator.canShare({files:[f]})){ await navigator.share({files:[f], title:name}); return 'shared'; } } catch(e){ if (e && e.name === 'AbortError') return 'cancel'; } return ''; }
async function doExport(){
  const filename = `ihsan-${isOldHome() ? 'perenos-' : ''}${key(today())}.json`;
  const txt0 = await exportText(), sh = await shareFile(txt0, filename, 'application/json');
  if (sh === 'shared'){ S.lastExport = Date.now(); save(); toast('Копия готова — сохрани её в «Файлы» или отправь себе'); return; } if (sh === 'cancel') return;
  try { const blob = new Blob([txt0], {type:'application/json'}); const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
    S.lastExport = Date.now(); save(); toast('Копия скачивается'); } catch(err){ toast('Скачивание не сработало — используй «Скопировать»'); }
}
setInterval(()=>{ if (KEY && Date.now()-lastAct > 10*60*1000){ flushDiary().then(()=>{ KEY = null; diaryCache = null; if (view==='diary') render(); }); } }, 30000);

/* ================== СТАРТ ================== */
(async function init(){
  applyTheme(); try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { applyTheme(); render(); }); } catch(e){}
  // приложение на экране «Домой» было установлено с адресом #today — теперь первым открывается город (один раз за запуск)
  if ((matchMedia('(display-mode: standalone)').matches || navigator.standalone) && location.hash === '#today' && !sessionStorage.getItem('opened')) history.replaceState(null, '', '#town');
  try { sessionStorage.setItem('opened', '1'); } catch(e){}
  route(); tCheck();
  // Офлайн-режим (PWA): только по https или на localhost. При открытии файла двойным щелчком (file://) ничего не делаем.
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost','127.0.0.1'].includes(location.hostname)))
    navigator.serviceWorker.register('sw.js').catch(()=>{});
  PH.before = await idbGet('photo_before'); PH.after = await idbGet('photo_after');
  photosLoaded = true;
  if (isOldHome() || view === 'path') render();
})();
